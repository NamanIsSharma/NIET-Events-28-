spring.application.name=niet-events
server.port=8080

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Set these with environment variables or application-local.properties.
spring.datasource.url=${NIET_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${NIET_DB_USERNAME:niet_app}
spring.datasource.password=${NIET_DB_PASSWORD:change-me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10

# Schema is applied deliberately through db/schema.sql during development.
spring.sql.init.mode=never

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
